[project]
name = "core-crewsim"
version = "0.1.0"
description = "Boilerplate FastAPI service for crewsim admin API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "psycopg[binary]>=3.1.0",
  "python-dotenv>=1.0.1",
  "pydantic-settings>=2.3.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0"
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.hatch.build]
exclude = [
  "/venv",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
